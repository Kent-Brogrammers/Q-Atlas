[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "q-atlas-backend"
version = "0.1.0"
description = "Shared contracts and local API for Q-Atlas"
requires-python = ">=3.11"
dependencies = ["fastapi", "pydantic>=2,<3", "uvicorn"]

[project.optional-dependencies]
hardware = ["qiskit-ibm-runtime==0.47.0"]
quantum = [
    "numpy>=2.2,<3",
    "scipy>=1.15,<2",
    "qiskit>=2.2,<3",
    "qiskit-aer>=0.17.2,<0.19",
    "networkx>=3.5,<4",
]

[dependency-groups]
dev = ["pytest", "httpx2", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --import-mode=importlib --strict-config --strict-markers"
markers = [
    "environment: local Qiskit Aer installation smoke tests (no hardware)",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
